<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entrar no Paquera — Acesse sua conta.">
    <title>Entrar — Paquera | clubewins.com.br</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="auth-page">
        <div class="auth-left">
            <div class="auth-left-content">
                <a href="index.html" class="auth-logo"><span class="logo-icon">❤</span> Paquera</a>
                <h1>Bem-vindo de volta ❤</h1>
                <p>Entre na sua conta e continue a buscar seu match perfeito.</p>
                <div class="auth-features">
                    <div class="auth-feature"><span>✓</span> Matches ilimitados</div>
                    <div class="auth-feature"><span>✓</span> Chat em tempo real</div>
                    <div class="auth-feature"><span>✓</span> Perfis verificados</div>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form-container">
                <h2>Entrar</h2>
                <p class="auth-subtitle">Acesse sua conta Paquera</p>
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Sua senha" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">👁</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember"> Lembrar de mim
                        </label>
                        <a href="#" class="link-muted">Esqueceu a senha?</a>
                    </div>
                    <div class="form-error" id="loginError"></div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>
                </form>
                <div class="auth-divider"><span>ou</span></div>
                <button class="btn btn-outline btn-block" onclick="socialLogin('google')">🔗 Entrar com Google</button>
                <button class="btn btn-outline btn-block" onclick="socialLogin('facebook')">📘 Entrar com Facebook</button>
                <p class="auth-switch">Não tem conta? <a href="cadastro.html">Cadastre-se grátis</a></p>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
